<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hip Hop Lord Directory</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f12; color: #fff; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
        .btn { background: #1f1f2e; color: #fff; border: 1px solid #333; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn.active, .btn:hover { background: #ff0055; border-color: #ff0055; }
        .search-box { padding: 10px 15px; border-radius: 6px; border: 1px solid #333; background: #1a1a24; color: #fff; width: 250px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #181824; border: 1px solid #2a2a3a; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-tag { font-size: 12px; color: #ff0055; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
        .card-title { font-size: 16px; margin: 0 0 10px 0; line-height: 1.4; }
        .card-btn { display: inline-block; text-align: center; background: #ff0055; color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .seo-cities { max-width: 1200px; margin: 50px auto 0; padding-top: 20px; border-top: 1px solid #222; text-align: center; }
        .city-link { color: #888; text-decoration: none; margin: 0 10px; font-size: 14px; }
        .city-link:hover { color: #ff0055; }
    </style>
</head>
<body>

<div class="header">
    <h1>HIP HOP LORD DIRECTORY</h1>
    <p>Find Top Producers, Engineers, Designers & Recording Studios</p>
</div>

<div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="Search by name, city, state...">
    <button class="btn active" onclick="filterCategory('All')">All</button>
    <button class="btn" onclick="filterCategory('Producers')">Producers</button>
    <button class="btn" onclick="filterCategory('Visuals')">Visuals</button>
    <button class="btn" onclick="filterCategory('Sound Engineers')">Sound Engineers</button>
    <button class="btn" onclick="filterCategory('Recording Studios')">Studios</button>
</div>

<div class="grid" id="directoryGrid"></div>

<!-- Local SEO Section -->
<div class="seo-cities">
    <h3>Top US Cities for Recording Studios</h3>
    <a href="#" class="city-link" onclick="searchCity('Atlanta')">Atlanta, GA</a> |
    <a href="#" class="city-link" onclick="searchCity('Los Angeles')">Los Angeles, CA</a> |
    <a href="#" class="city-link" onclick="searchCity('New York')">New York, NY</a> |
    <a href="#" class="city-link" onclick="searchCity('Miami')">Miami, FL</a> |
    <a href="#" class="city-link" onclick="searchCity('Chicago')">Chicago, IL</a> |
    <a href="#" class="city-link" onclick="searchCity('Houston')">Houston, TX</a>
</div>

<script>
let masterData = [];
let currentCategory = 'All';

fetch('directory.json')
    .then(res => res.json())
    .then(data => {
        masterData = data;
        renderCards(masterData);
    });

function renderCards(data) {
    const grid = document.getElementById('directoryGrid');
    grid.innerHTML = '';
    
    data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let buttonHTML = '';
        if(item.affiliate_url) {
            buttonHTML = `<a href="${item.affiliate_url}" target="_blank" class="card-btn">View Service</a>`;
        } else if(item.website) {
            buttonHTML = `<a href="${item.website}" target="_blank" class="card-btn">Visit Website</a>`;
        } else if(item.url) {
            buttonHTML = `<a href="${item.url}" target="_blank" class="card-btn">Listen Now</a>`;
        }

        let extraDetails = item.price ? `<p><strong>Price:</strong> ${item.price}</p>` : '';
        if(item.address) extraDetails += `<p><small>${item.address}</small></p>`;

        card.innerHTML = `
            <div>
                <div class="card-tag">${item.category}</div>
                <h3 class="card-title">${item.title}</h3>
                ${extraDetails}
            </div>
            ${buttonHTML}
        `;
        grid.appendChild(card);
    });
}

function filterCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    applyFilters();
}

document.getElementById('searchInput').addEventListener('input', applyFilters);

function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = masterData.filter(item => {
        const matchesCat = (currentCategory === 'All' || item.category === currentCategory);
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              (item.city && item.city.toLowerCase().includes(query)) ||
                              (item.address && item.address.toLowerCase().includes(query));
        return matchesCat && matchesSearch;
    });
    renderCards(filtered);
}

function searchCity(city) {
    document.getElementById('searchInput').value = city;
    filterCategory('Recording Studios');
}
</script>

</body>
</html>
